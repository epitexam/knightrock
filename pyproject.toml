[project]
name = "knightrock"
version = "0.1.0"
description = "A 2D Hack 'n' Slash platformer developed in Python with pygame-ce."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.7",
    "pytmx>=3.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# The suite used to collect warnings and act on none of them, which is how nine
# deprecation warnings arrived in a new test file and nobody noticed: the run
# ended in a green line with a number next to it that read like a detail. Every
# deprecation is now an error, so the next one stops the build.
#
# Two are accepted, listed last because in pytest the last matching filter
# wins, so they carve their exceptions out of the errors above rather than
# being overridden by them.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error::ResourceWarning",
  # Accepted, not fixed: see src/core/display/stage.py::_recenter. Centring on
  # the primary display needs SDL's WINDOWPOS_CENTERED, which only the Window
  # class accepts, and reaching that class for a set_mode window is what is
  # deprecated. The call is guarded, so a future pygame costs us exact centring
  # and nothing else. Removing the warning means either centring the client area
  # ourselves -- about fifteen pixels high, because of the title bar -- or
  # moving the whole game to the Window API, which changes vsync, HiDPI and
  # resizing and can only be judged on a real desktop.
  "ignore:Please use Window.get_surface and Window.flip:DeprecationWarning",
  # SDL's own message, because the dummy video driver has no accelerated
  # renderer. It does not appear under x11. Not ours to fix.
  "ignore:no fast renderer available:Warning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C901", "SIM", "N"]
ignore = [
    "E501",
    # (str, Enum) is the codebase convention for state names
    # (PlayerState, EnemyState): drop-in compatible with StateMachine keys.
    "UP042",
    # Generic[T] subclass keeps the Registry compatible on 3.14 + mypy.
    "UP046",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# `src` carries no per-module overrides any more: the last one
# (`src.core.rendering.*`, 16 hidden errors) was closed 2026-09-25 by
# annotating renderer.py. `disallow_incomplete_defs` is global for the same
# reason -- a partially annotated signature is a lie mypy cannot check.
# mypy is blocking in CI (`uv run mypy src`).

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]
