name: Build and Release
on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=50
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: knightrock-linux
          - os: windows-latest
            artifact_name: knightrock-windows
          - os: macos-latest
            artifact_name: knightrock-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --no-dev
      - name: Build executable
        run: uv run --with pyinstaller==6.22.2 pyinstaller knightrock.spec --noconfirm --clean
      - name: Smoke test executable
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          executable = Path("dist/knightrock/knightrock")
          if os.name == "nt":
              executable = executable.with_suffix(".exe")

          environment = os.environ.copy()
          environment["SDL_VIDEODRIVER"] = "dummy"
          environment["SDL_AUDIODRIVER"] = "dummy"
          process = subprocess.Popen([str(executable)], env=environment)
          try:
              return_code = process.wait(timeout=5)
          except subprocess.TimeoutExpired:
              process.terminate()
              process.wait(timeout=5)
          else:
              raise SystemExit(
                  f"Packaged game exited during smoke test with code {return_code}"
              )
          PY
      - name: Compress build (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist knightrock
      - name: Compress build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/knightrock -DestinationPath ${{ matrix.artifact_name }}.zip
      - name: Upload Unix artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true