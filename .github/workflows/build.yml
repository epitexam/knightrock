name: Build and Release
on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A hung test would otherwise burn the full 6h default budget.
    timeout-minutes: 15
    env:
      # Defence in depth: each test module also sets these itself, so one
      # without its own fixture cannot fail on collection order alone.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        # --frozen: a lockfile that no longer matches pyproject.toml must fail
        # the build rather than silently re-resolve and hide the drift.
        run: uv sync --frozen --dev
      - name: Lint (ruff check)
        run: uv run ruff check src tests main.py tools
      - name: Format check (ruff format)
        run: uv run ruff format --check src tests main.py tools
      - name: Type check (mypy)
        run: uv run mypy src main.py tools
      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Run tests with DEBUG enabled
        env:
          DEBUG: "1"
        run: uv run pytest -q
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: knightrock-linux
          - os: windows-latest
            artifact_name: knightrock-windows
          - os: macos-latest
            artifact_name: knightrock-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # assets/ is git-ignored and absent on a fresh checkout: until the final
      # art and TMX files are supplied, these artifacts carry no world data.
      - name: Install project dependencies
        run: uv sync --frozen --no-dev
      - name: Build executable
        run: uv run --with pyinstaller==6.22.2 pyinstaller knightrock.spec --noconfirm --clean
      # A build without assets cannot pass a boot-and-draw check. Until the
      # final art and TMX files land, say so instead of pretending the check
      # ran; once they do, this becomes a real gate on every packaged build.
      - name: Smoke test executable
        if: hashFiles('assets/data/levels/1.tmx') != ''
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          executable = Path("dist/knightrock/knightrock")
          if os.name == "nt":
              executable = executable.with_suffix(".exe")

          environment = os.environ.copy()
          environment["SDL_VIDEODRIVER"] = "dummy"
          environment["SDL_AUDIODRIVER"] = "dummy"
          result = subprocess.run(
              [str(executable), "--check"],
              env=environment,
              capture_output=True,
              text=True,
              timeout=10,
          )
          if result.stdout:
              print(result.stdout)
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              raise SystemExit(
                  f"Packaged --check failed with code {result.returncode}"
              )
          PY
      - name: Compress build (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist knightrock
      - name: Compress build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/knightrock -DestinationPath ${{ matrix.artifact_name }}.zip
      - name: Upload Unix artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true